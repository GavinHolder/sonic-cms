# =============================================================================
# CLIENT CMS — Build & Deploy (STANDARD TEMPLATE)
# =============================================================================
#
# This is the CANONICAL deploy workflow for ALL client CMS instances.
# Copy this file to: .github/workflows/deploy.yml in the client repo.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  SETUP: Add these 5 secrets to the client GitHub repo:             │
# │                                                                     │
# │  PORTAINER_URL          https://portainer.example.com (no slash)   │
# │  PORTAINER_USERNAME     Portainer login user (default: admin)      │
# │  PORTAINER_PASSWORD     Portainer login password                   │
# │  PORTAINER_STACK_ID     From Portainer URL: ?id=X                  │
# │  PORTAINER_ENDPOINT_ID  From Portainer URL: #!/X/docker/...        │
# │                                                                     │
# │  ALSO: Update IMAGE env var below to match the client repo name.   │
# └─────────────────────────────────────────────────────────────────────┘
#
# Flow:
#   push to main → test → build Docker image → push to GHCR → Portainer redeploys
#
# Manual trigger with merge_upstream=true:
#   → merges latest white-label-cms → then builds → deploys
#
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/cms-version.json'
      - 'public/versions/**'
  workflow_dispatch:
    inputs:
      merge_upstream:
        description: "Merge latest from upstream white-label-cms before building"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

# ┌──────────────────────────────────────────────────────┐
# │  CHANGE THESE to match your client repo/deploy:       │
# │  IMAGE               e.g. ghcr.io/yourorg/my-cms      │
# │  APP_CONTAINER_NAME  the app container's `docker ps`  │
# │                      name — only used by the stack-   │
# │                      recreate fallback (see Fallback  │
# │                      2 below), when Portainer's own   │
# │                      stack stop/start API rejects a   │
# │                      stack it doesn't fully own.      │
# └──────────────────────────────────────────────────────┘
env:
  IMAGE: ghcr.io/gavinholder/sonic-cms
  APP_CONTAINER_NAME: sonic-cms-app
  HEALTH_CHECK_URL: https://backend.sonic.co.za/admin/login

permissions:
  contents: write
  packages: write

jobs:
  # ── Job 0: Merge upstream CMS updates (only on manual trigger) ───────────
  upstream-merge:
    name: Merge Upstream
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.merge_upstream == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable merge=ours driver
        run: git config merge.ours.driver true

      - name: Add upstream and merge
        run: |
          UPSTREAM="${{ secrets.UPSTREAM_REPO_URL || 'https://github.com/GavinHolder/white-label-cms.git' }}"
          git remote add upstream "$UPSTREAM" || git remote set-url upstream "$UPSTREAM"
          git fetch upstream main
          echo "Merging upstream/main into local main..."
          git merge upstream/main --no-edit --allow-unrelated-histories || {
            echo "Merge conflict detected — auto-resolving..."
            # Accept all upstream changes, then re-apply ours for protected files
            git checkout --theirs . 2>/dev/null || true
            # Re-apply our versions of protected files (.gitattributes merge=ours)
            git diff --name-only --diff-filter=U | while read f; do
              if git show HEAD:"$f" >/dev/null 2>&1; then
                git checkout --ours "$f" 2>/dev/null || true
              else
                git add "$f" 2>/dev/null || true
              fi
            done
            git add -A
            git commit --no-edit -m "chore: merge upstream with conflict resolution" || true
          }
          # Remove main-repo-only workflow files that clients shouldn't have
          # (GITHUB_TOKEN can't push workflow files it didn't create)
          for wf in notify-clients.yml auto-version.yml publish-channel.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              git rm ".github/workflows/$wf" 2>/dev/null || true
            fi
          done
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "chore: remove main-repo-only workflows from client"
          fi

          # Sync cms-version.json version number from upstream (keeps our changelog content)
          UPSTREAM_VER=$(git show upstream/main:public/cms-version.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          if [ -n "$UPSTREAM_VER" ]; then
            CURRENT_VER=$(jq -r '.version' public/cms-version.json 2>/dev/null || echo "")
            if [ "$UPSTREAM_VER" != "$CURRENT_VER" ]; then
              TODAY=$(date -u +%Y-%m-%d)
              jq --arg v "$UPSTREAM_VER" --arg d "$TODAY" '.version = $v | .date = $d' public/cms-version.json > /tmp/cms-ver-new.json
              mv /tmp/cms-ver-new.json public/cms-version.json
              echo "Bumped cms-version.json: $CURRENT_VER -> $UPSTREAM_VER"
              git add public/cms-version.json
              git commit -m "chore: sync cms version to v$UPSTREAM_VER from upstream"
            else
              echo "cms-version.json already at v$UPSTREAM_VER — no bump needed"
            fi
          fi

          git push origin main

  # ── Job 1: Run tests ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [upstream-merge]
    if: always() && (needs.upstream-merge.result == 'success' || needs.upstream-merge.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret-key-for-ci-pipeline-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci-at-least-32-chars

  # ── Job 2: Build and push Docker image to GHCR ──────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Redeploy via Portainer API ────────────────────────────────────
  deploy:
    name: Deploy via Portainer
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result == 'success'

    steps:
      - name: Redeploy stack
        run: |
          # Skip if secrets not configured
          if [ -z "${{ secrets.PORTAINER_URL }}" ] || [ -z "${{ secrets.PORTAINER_PASSWORD }}" ]; then
            echo "⚠️ PORTAINER_URL or PORTAINER_PASSWORD not set — skipping deploy"
            echo "Set these 4 secrets: PORTAINER_URL, PORTAINER_PASSWORD, PORTAINER_STACK_ID, PORTAINER_ENDPOINT_ID"
            exit 0
          fi

          # Authenticate with Portainer
          PORTAINER_USER="${{ secrets.PORTAINER_USERNAME }}"
          PORTAINER_USER="${PORTAINER_USER:-admin}"
          echo "🔑 Authenticating with Portainer as $PORTAINER_USER..."
          JWT=$(curl -s -X POST "${{ secrets.PORTAINER_URL }}/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$PORTAINER_USER\",\"password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}" \
            | jq -r '.jwt')

          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "❌ Portainer authentication failed — check PORTAINER_PASSWORD"
            exit 1
          fi

          STACK_ID="${{ secrets.PORTAINER_STACK_ID }}"
          ENDPOINT_ID="${{ secrets.PORTAINER_ENDPOINT_ID }}"
          BASE_URL="${{ secrets.PORTAINER_URL }}"
          AUTH="Authorization: Bearer $JWT"

          # Step 1: Read current stack to preserve environment variables
          echo "📋 Reading current stack configuration..."
          STACK_DATA=$(curl -s "$BASE_URL/api/stacks/$STACK_ID" \
            -H "$AUTH")

          # Extract current env vars (CRITICAL — without this, redeploy wipes all env vars)
          CURRENT_ENV=$(echo "$STACK_DATA" | jq -c '.Env // []')
          ENV_COUNT=$(echo "$CURRENT_ENV" | jq 'length')
          echo "  Found $ENV_COUNT environment variables to preserve"

          if [ "$ENV_COUNT" = "0" ] || [ "$CURRENT_ENV" = "null" ] || [ "$CURRENT_ENV" = "[]" ]; then
            echo "⚠️ WARNING: Stack has 0 env vars! This usually means the stack was created without env vars."
            echo "⚠️ Set env vars in Portainer UI first, then redeploy."
            echo "⚠️ Proceeding anyway — container will start but may fail without DATABASE_URL etc."
          fi

          # Step 2: Redeploy WITH env vars preserved
          echo "🚀 Triggering stack redeploy (preserving $ENV_COUNT env vars)..."
          REDEPLOY_BODY=$(jq -n \
            --argjson env "$CURRENT_ENV" \
            '{env: $env, pullImage: true, prune: false}')

          RESPONSE=$(curl -s -o /tmp/portainer_response.txt -w "%{http_code}" -X PUT \
            "$BASE_URL/api/stacks/$STACK_ID/git/redeploy?endpointId=$ENDPOINT_ID" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "$REDEPLOY_BODY")

          echo "Portainer response: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Stack redeployed successfully (env vars preserved)"
          elif [ "$RESPONSE" = "400" ] || [ "$RESPONSE" = "500" ]; then
            ERRDETAIL=$(cat /tmp/portainer_response.txt 2>/dev/null)
            echo "⚠️ Git redeploy failed ($RESPONSE): $ERRDETAIL"

            # Fallback 1: Direct stack update (works for stacks with compose content)
            COMPOSE=$(echo "$STACK_DATA" | jq -r '.StackFileContent // empty')
            if [ -n "$COMPOSE" ]; then
              echo "Trying direct stack update..."
              UPDATE_BODY=$(jq -n \
                --argjson env "$CURRENT_ENV" \
                --arg compose "$COMPOSE" \
                '{env: $env, stackFileContent: $compose, prune: false}')

              RESPONSE2=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                "$BASE_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
                -H "$AUTH" \
                -H "Content-Type: application/json" \
                -d "$UPDATE_BODY")

              if [ "$RESPONSE2" = "200" ]; then
                echo "✅ Stack updated via direct method (env vars preserved)"
              else
                echo "⚠️ Direct update failed ($RESPONSE2). Trying container restart..."
              fi
            fi

            # Fallback 2: recreate the app container directly via Portainer's Docker
            # API proxy, bypassing the STACK-level stop/start endpoints entirely.
            #
            # Why not stack stop/start (what this used to do): those endpoints
            # returned 400 on stop / 409 on start for this stack, consistently,
            # across 3 deploys in a row — root-caused to Portainer not fully "owning"
            # this stack's lifecycle (its GET /api/stacks/$STACK_ID response has an
            # EMPTY StackFileContent even though the containers carry correct compose
            # labels, which is also why Fallback 1 above silently no-ops instead of
            # running). A stack Portainer can't read the compose file for is a stack
            # its own start/stop orchestration can't reliably manage either.
            #
            # Why not a plain container stop+start (the naive alternative): a
            # container is bound to the image it was CREATED with — starting the
            # SAME container again just resumes the OLD image's process. Picking up
            # a newly pulled image needs the container actually re-created, not
            # restarted. This does exactly that, safely:
            #   1. Read the CURRENT container's full config (image tag, labels,
            #      volume binds, every network it's on) - nothing here is
            #      hardcoded/guessed, all of it is captured live so config drift in
            #      Portainer never goes stale in this workflow file.
            #   2. Rename it out of the way (frees the container name; the OLD
            #      container keeps running under the new name — nothing stops yet).
            #   3. Create + start a NEW container under the original name, using the
            #      captured config but the freshly pulled image.
            #   4. Health-check the live site through the real public URL (proves
            #      Traefik is actually routing to the new container, not just that
            #      it booted).
            #   5. Healthy -> remove the renamed-old container. Unhealthy -> remove
            #      the broken new one and rename old back - the site is never left
            #      without a working container in either outcome.
            if [ "${RESPONSE2:-0}" != "200" ]; then
              DOCKER_API="$BASE_URL/api/endpoints/$ENDPOINT_ID/docker"
              OLD_NAME="${{ env.APP_CONTAINER_NAME }}"
              RENAMED_OLD="${OLD_NAME}-predeploy"

              echo "📦 Pulling latest image via Portainer Docker API..."
              PULL_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                "$DOCKER_API/images/create?fromImage=${{ env.IMAGE }}&tag=latest" \
                -H "$AUTH")
              echo "  Image pull: $PULL_RESP"

              echo "🔍 Reading current container config..."
              CURRENT_CONTAINER=$(curl -s "$DOCKER_API/containers/$OLD_NAME/json" -H "$AUTH")
              CONTAINER_FOUND=$(echo "$CURRENT_CONTAINER" | jq -r '.Id // empty')
              if [ -z "$CONTAINER_FOUND" ]; then
                echo "❌ Could not read container '$OLD_NAME' — check APP_CONTAINER_NAME. Response:"
                echo "$CURRENT_CONTAINER"
                exit 1
              fi

              PRIMARY_NETWORK=$(echo "$CURRENT_CONTAINER" | jq -r '.HostConfig.NetworkMode')
              EXTRA_NETWORKS=$(echo "$CURRENT_CONTAINER" | jq -c --arg n "$PRIMARY_NETWORK" \
                '[.NetworkSettings.Networks | keys[] | select(. != $n)]')
              # Docker's own container-level Env (KEY=value strings) is already the
              # exact live config — no need to reconvert Portainer's stack-level
              # {name,value} pairs from earlier in this script.
              CREATE_BODY=$(echo "$CURRENT_CONTAINER" | jq -c --arg img "${{ env.IMAGE }}:latest" '{
                Image: $img,
                Env: .Config.Env,
                Labels: .Config.Labels,
                ExposedPorts: .Config.ExposedPorts,
                HostConfig: {
                  Binds: .HostConfig.Binds,
                  NetworkMode: .HostConfig.NetworkMode,
                  RestartPolicy: .HostConfig.RestartPolicy
                }
              }')

              echo "🔀 Renaming current container out of the way..."
              RENAME_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                "$DOCKER_API/containers/$OLD_NAME/rename?name=$RENAMED_OLD" -H "$AUTH")
              echo "  Rename: $RENAME_RESP"
              if [ "$RENAME_RESP" != "204" ]; then
                echo "❌ Could not rename old container — aborting before touching anything live."
                exit 1
              fi

              echo "🏗️  Creating new container with the fresh image..."
              CREATE_RESP=$(curl -s -w "\n%{http_code}" -X POST \
                "$DOCKER_API/containers/create?name=$OLD_NAME" \
                -H "$AUTH" -H "Content-Type: application/json" -d "$CREATE_BODY")
              CREATE_CODE=$(echo "$CREATE_RESP" | tail -n1)
              CREATE_JSON=$(echo "$CREATE_RESP" | sed '$d')
              NEW_ID=$(echo "$CREATE_JSON" | jq -r '.Id // empty')
              echo "  Create: $CREATE_CODE"

              rollback() {
                echo "↩️  Rolling back — removing broken new container, restoring old one..."
                [ -n "$NEW_ID" ] && curl -s -o /dev/null -X POST "$DOCKER_API/containers/$NEW_ID/stop" -H "$AUTH"
                [ -n "$NEW_ID" ] && curl -s -o /dev/null -X DELETE "$DOCKER_API/containers/$NEW_ID?force=true" -H "$AUTH"
                curl -s -o /dev/null -X POST "$DOCKER_API/containers/$RENAMED_OLD/rename?name=$OLD_NAME" -H "$AUTH"
                echo "❌ Deploy failed — old container restored, site should be back on the previous version."
                exit 1
              }

              if [ "$CREATE_CODE" != "201" ] || [ -z "$NEW_ID" ]; then
                echo "$CREATE_JSON"
                rollback
              fi

              for NET in $(echo "$EXTRA_NETWORKS" | jq -r '.[]'); do
                echo "🔌 Connecting new container to network: $NET"
                CONNECT_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  "$DOCKER_API/networks/$NET/connect" -H "$AUTH" -H "Content-Type: application/json" \
                  -d "{\"Container\":\"$NEW_ID\"}")
                echo "  Connect $NET: $CONNECT_RESP"
              done

              echo "🚀 Starting new container..."
              START_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                "$DOCKER_API/containers/$NEW_ID/start" -H "$AUTH")
              echo "  Start: $START_RESP"
              if [ "$START_RESP" != "204" ]; then
                rollback
              fi

              echo "🩺 Health-checking ${{ env.HEALTH_CHECK_URL }}..."
              HEALTHY="false"
              for i in 1 2 3 4 5 6; do
                sleep 5
                CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.HEALTH_CHECK_URL }}")
                echo "  Attempt $i: HTTP $CODE"
                if [ "$CODE" = "200" ]; then HEALTHY="true"; break; fi
              done

              if [ "$HEALTHY" != "true" ]; then
                rollback
              fi

              echo "✅ New container healthy — removing old one..."
              curl -s -o /dev/null -X POST "$DOCKER_API/containers/$RENAMED_OLD/stop" -H "$AUTH"
              curl -s -o /dev/null -X DELETE "$DOCKER_API/containers/$RENAMED_OLD?force=true" -H "$AUTH"
              echo "✅ Container recreated with new image"
            fi
          else
            echo "❌ Deploy failed with HTTP $RESPONSE"
            cat /tmp/portainer_response.txt 2>/dev/null
            exit 1
          fi

          # Step 3: Prune dangling images left behind by this deploy's pull.
          # `pullImage: true`/the Docker API pull above always fetches a fresh
          # `:latest` layer set but never removes the previous one — every one of
          # these becomes a permanent ~500MB dangling (<none>) image, and Portainer's
          # own `prune` flag above only prunes orphaned STACK SERVICES, not images.
          # Left unchecked across enough deploys this fills the host disk, which is
          # exactly what took the site down (Postgres crash-looped on "no space left
          # on device", cascading into a failed redeploy — see incident 2026-08-25).
          # Docker's images/prune endpoint with no filter defaults to dangling-only
          # (same as plain `docker image prune`, not `-a`), so this only ever removes
          # image layers nothing references — never a tagged/in-use image.
          echo "🧹 Pruning dangling images to keep the host disk from filling up..."
          PRUNE_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$BASE_URL/api/endpoints/$ENDPOINT_ID/docker/images/prune" \
            -H "$AUTH")
          echo "  Image prune: $PRUNE_RESP"
